[package]
name = "tas-verifier"
version = "0.1.0"
edition = "2021"
description = "Deterministic TAS v1 verification pipeline and audit receipt CLI"
license = "Apache-2.0"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
ed25519-dalek = "2.1"
hex = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_jcs = "0.1"
serde_json = "1.0"
sha2 = "0.10"

[dev-dependencies]
ed25519-dalek = { version = "2.1", features = ["rand_core"] }

